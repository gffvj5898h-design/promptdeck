<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>Обновление PromptDeck</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b0d12;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif}.box{max-width:420px;padding:28px;text-align:center}.spin{width:44px;height:44px;border:4px solid #2e3542;border-top-color:#a7b5ff;border-radius:50%;margin:0 auto 18px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:22px;margin:0 0 8px}p{color:#9aa5b4;line-height:1.5}</style></head><body><div class="box"><div class="spin"></div><h1>Обновляю PromptDeck</h1><p>Очищаю старый PWA-кэш и загружаю актуальную версию.</p></div><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('promptdeck-')).map(k=>caches.delete(k)));}}catch(e){}const u='./?v=021&refresh='+Date.now();setTimeout(()=>location.replace(u),350);})();</script></body></html>
